# Example run configuration
input: /path/to/samplesheet.csv
outdir: results
container_image: magspi:0.2.0
host_reference: /path/to/host.fa
checkm_db: /path/to/checkm_db
gtdbtk_db: /path/to/gtdbtk_db
run_seqkit: true
run_quast: true
run_checkm: true
run_taxonomy: true
run_dereplication: true
run_instrain: false
