# Single-environment build of the whole toolchain, used only by
# containers/Dockerfile. This is NOT the default execution path -- each
# process declares its own pinned container (see docs/container.md).
#
# These versions are the set that actually co-installs on linux-64; several
# differ from the per-process pins, inStrain most consequentially
# (1.3.4 here vs 1.7.1 pinned). Verified with:
#   micromamba create --dry-run --platform linux-64 -f envs/mags_pipeline.yml
name: mags-pipeline
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - fastp=1.3.7
  - bowtie2=2.5.5
  - samtools=1.24
  - bbmap=40.02
  - seqkit=2.14.0
  - spades=4.3.0
  - quast=5.3.0
  - metabat2
  - maxbin2=2.2.7
  - concoct=1.1.0
  - das_tool=1.1.7
  - diamond=2.2.8
  - checkm-genome=1.2.4
  - gtdbtk=2.7.2
  - drep=3.7.1
  - instrain=1.3.4
