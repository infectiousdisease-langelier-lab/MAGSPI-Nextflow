name: Release checks

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source archive
        run: tar --exclude='./.git' -czf magspi-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: magspi-source
          path: magspi-source.tar.gz
